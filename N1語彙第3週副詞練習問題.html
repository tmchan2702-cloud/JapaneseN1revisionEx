<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日文綜合實戰特訓 50 題（含速查卡片與多元題型）</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --border-color: #e5e7eb;
            --success-color: #10b981;
            --error-color: #ef4444;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 20px;
        }
        
        /* 生字速查卡片面板樣式 */
        .vocab-panel {
            background-color: #e0e7ff;
            border: 1px solid #c7d2fe;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .vocab-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            font-weight: 600;
            color: var(--primary-color);
        }
        .vocab-content {
            margin-top: 10px;
            display: none;
            font-size: 0.95rem;
        }
        .vocab-content.show {
            display: block;
        }
        .vocab-days-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .day-tab {
            padding: 4px 10px;
            background: white;
            border: 1px solid #a5b4fc;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .day-tab.active {
            background: var(--primary-color);
            color: white;
        }
        .vocab-list {
            background: white;
            padding: 10px;
            border-radius: 6px;
            max-height: 180px;
            overflow-y: auto;
        }

        /* 導航跳題面板 */
        .jump-panel {
            background-color: #f9fafb;
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            max-height: 120px;
            overflow-y: auto;
        }
        .jump-panel-title {
            font-size: 0.875rem;
            font-weight: 600;
            color: #4b5563;
            margin-bottom: 8px;
        }
        .jump-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .jump-btn {
            width: 32px;
            height: 32px;
            font-size: 0.8rem;
            border: 1px solid var(--border-color);
            background-color: white;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .jump-btn:hover {
            border-color: var(--primary-color);
            background-color: #e0e7ff;
        }
        .jump-btn.active {
            border-width: 2px;
            font-weight: bold;
        }
        /* 答對：綠色 */
        .jump-btn.correct {
            background-color: #d1fae5;
            border-color: var(--success-color);
            color: #065f46;
        }
        /* 答錯：紅色 */
        .jump-btn.incorrect {
            background-color: #fee2e2;
            border-color: var(--error-color);
            color: #991b1b;
        }

        .score-board {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #eef2ff;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 600;
            color: var(--primary-color);
        }
        .progress-bar {
            width: 100%;
            background-color: var(--border-color);
            border-radius: 9999px;
            height: 8px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .progress {
            height: 100%;
            background-color: var(--primary-color);
            width: 0%;
            transition: width 0.3s ease;
        }
        .quiz-box {
            margin-bottom: 20px;
        }
        .question-tag {
            display: inline-block;
            background: #e0e7ff;
            color: var(--primary-color);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .question-number {
            font-size: 0.875rem;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 5px;
        }
        .question-text {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        @media (min-width: 640px) {
            .options-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
        .option-btn {
            background-color: #ffffff;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            text-align: left;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .option-btn:hover:not(:disabled) {
            border-color: var(--primary-color);
            background-color: #e0e7ff;
        }
        .option-btn:disabled {
            cursor: not-allowed;
        }
        .option-btn.correct {
            background-color: #d1fae5 !important;
            border-color: var(--success-color) !important;
            color: #065f46;
        }
        .option-btn.incorrect {
            background-color: #fee2e2 !important;
            border-color: var(--error-color) !important;
            color: #991b1b;
        }
        .explanation-box {
            background-color: #f9fafb;
            border-left: 4px solid var(--primary-color);
            padding: 15px;
            border-radius: 0 8px 8px 0;
            margin-top: 20px;
            display: none;
        }
        .explanation-box.show {
            display: block;
        }
        .explanation-box h3 {
            margin-top: 0;
            color: var(--primary-color);
            font-size: 1.1rem;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .action-btn {
            flex: 1;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .action-btn:hover {
            background-color: var(--primary-hover);
        }
        .action-btn.secondary {
            background-color: #6b7280;
        }
        .action-btn.secondary:hover {
            background-color: #4b5563;
        }
        .score-card {
            text-align: center;
            display: none;
        }
        .score-card h2 {
            font-size: 2rem;
            color: var(--primary-color);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>日文綜合實戰特訓 50 題</h1>
    <div class="subtitle">含全句翻譯、即時錯項詳細解析、漢字平假名串字轉換、填充題與生字速查卡片</div>
    
    <!-- 生字速查卡片面板 (1日目 ~ 6日目) -->
    <div class="vocab-panel">
        <div class="vocab-header" onclick="toggleVocabPanel()">
            <span>📖 【生字速查卡片面板】（1日目～6日目 核心精選）</span>
            <span id="vocab-toggle-icon">▼ 展開速查</span>
        </div>
        <div class="vocab-content" id="vocab-content">
            <div class="vocab-days-tabs">
                <button class="day-tab active" onclick="switchVocabDay(1)">1日目 (副詞特訓A)</button>
                <button class="day-tab" onclick="switchVocabDay(2)">2日目 (副詞特訓B)</button>
                <button class="day-tab" onclick="switchVocabDay(3)">3日目 (狀態與程度)</button>
                <button class="day-tab" onclick="switchVocabDay(4)">4日目 (漢字讀音轉換)</button>
                <button class="day-tab" onclick="switchVocabDay(5)">5日目 (動詞填充精選)</button>
                <button class="day-tab" onclick="switchVocabDay(6)">6日目 (高級複合副詞)</button>
            </div>
            <div class="vocab-list" id="vocab-list-container">
                <!-- 動態載入生字 -->
            </div>
        </div>
    </div>

    <!-- 自由選題跳題面板 -->
    <div class="jump-panel">
        <div class="jump-panel-title">快速跳題（🟢 答得正確 / 🔴 答得錯誤）：</div>
        <div class="jump-grid" id="jump-grid">
            <!-- 動態生成 1~50 按鈕 -->
        </div>
    </div>

    <!-- 即時計分板 -->
    <div class="score-board">
        <span id="score-text">目前得分：0 / 50</span>
        <span id="answered-count-text">已作答：0 / 50</span>
    </div>

    <div id="quiz-container">
        <div class="progress-bar">
            <div class="progress" id="progress"></div>
        </div>
        <div class="quiz-box">
            <div id="q-tag" class="question-tag">詞義辨析題</div>
            <div class="question-number" id="q-num">第 1 題 / 共 50 題</div>
            <div class="question-text" id="q-text">題目載入中...</div>
            <div class="options-grid" id="options-grid"></div>
        </div>
        
        <div class="explanation-box" id="explanation-box">
            <h3>詳解與全句翻譯</h3>
            <p id="explanation-content"></p>
        </div>
        
        <div class="btn-group">
            <button class="action-btn secondary" onclick="prevQuestion()">上一題</button>
            <button class="action-btn" id="next-btn" onclick="nextQuestion()">下一題</button>
        </div>
    </div>

    <div class="score-card" id="score-card">
        <h2>練習完成總結！</h2>
        <p id="final-score" style="font-size: 1.2rem; margin: 20px 0;"></p>
        <button class="action-btn" onclick="restartQuiz()">重新開始練習</button>
    </div>
</div>

let currentQuestion = 0;
let userAnswers = new Array(quizData.length).fill(null);

const qTagEl = document.getElementById('q-tag');
const qNumEl = document.getElementById('q-num');
const qTextEl = document.getElementById('q-text');
const optionsGridEl = document.getElementById('options-grid');
const explanationBoxEl = document.getElementById('explanation-box');
const explanationContentEl = document.getElementById('explanation-content');
const progressBarEl = document.getElementById('progress');
const quizContainerEl = document.getElementById('quiz-container');
const scoreCardEl = document.getElementById('score-card');
const finalScoreEl = document.getElementById('final-score');
const scoreTextEl = document.getElementById('score-text');
const answeredCountTextEl = document.getElementById('answered-count-text');
const jumpGridEl = document.getElementById('jump-grid');
const vocabContentEl = document.getElementById('vocab-content');
const vocabToggleIconEl = document.getElementById('vocab-toggle-icon');
const vocabListContainerEl = document.getElementById('vocab-list-container');

// 切換生字速查卡片面板開合
function toggleVocabPanel() {
    vocabContentEl.classList.toggle('show');
    if (vocabContentEl.classList.contains('show')) {
        vocabToggleIconEl.innerText = "▲ 收起速查";
        switchVocabDay(1);
    } else {
        vocabToggleIconEl.innerText = "▼ 展開速查";
    }
}

// 切換速查卡片天數
function switchVocabDay(day) {
    const tabs = document.querySelectorAll('.day-tab');
    tabs.forEach((tab, index) => {
        if (index + 1 === day) {
            tab.classList.add('active');
        } else {
            tab.classList.remove('active');
        }
    });

    const list = vocabData[day] || [];
    vocabListContainerEl.innerHTML = list.map(item => `<div>${item}</div>`).join('');
}

// 初始化上方快速跳題面板
function initJumpPanel() {
    jumpGridEl.innerHTML = '';
    for (let i = 0; i < quizData.length; i++) {
        const btn = document.createElement('button');
        btn.className = 'jump-btn';
        btn.innerText = i + 1;
        btn.onclick = () => goToQuestion(i);
        jumpGridEl.appendChild(btn);
    }
    updateJumpPanelUI();
}

function updateJumpPanelUI() {
    const buttons = jumpGridEl.getElementsByClassName('jump-btn');
    for (let i = 0; i < buttons.length; i++) {
        buttons[i].classList.remove('active');
        buttons[i].classList.remove('correct');
        buttons[i].classList.remove('incorrect');

        // 標記目前所在題號
        if (i === currentQuestion) {
            buttons[i].classList.add('active');
        }

        // 根據作答結果賦予對應顏色 (true = 綠色, false = 紅色)
        if (userAnswers[i] === true) {
            buttons[i].classList.add('correct');
        } else if (userAnswers[i] === false) {
            buttons[i].classList.add('incorrect');
        }
    }
}

function updateScoreBoard() {
    let correctCount = userAnswers.filter(ans => ans === true).length;
    let answeredCount = userAnswers.filter(ans => ans !== null).length;
    
    scoreTextEl.innerText = `目前得分：${correctCount} / ${quizData.length}`;
    answeredCountTextEl.innerText = `已作答：${answeredCount} / ${quizData.length}`;
}

function loadQuestion() {
    const q = quizData[currentQuestion];
    qTagEl.innerText = q.type;
    qNumEl.innerText = `第 ${currentQuestion + 1} 題 / 共 ${quizData.length} 題`;
    qTextEl.innerText = q.question;
    
    const progressPercent = ((currentQuestion + 1) / quizData.length) * 100;
    progressBarEl.style.width = `${progressPercent}%`;
    
    optionsGridEl.innerHTML = '';
    const alreadyAnswered = userAnswers[currentQuestion] !== null;
    
    q.options.forEach((opt, index) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt;
        
        if (alreadyAnswered) {
            btn.disabled = true;
            if (index === q.answer) {
                btn.classList.add('correct');
            }
        }
        
        btn.onclick = () => selectOption(index);
        optionsGridEl.appendChild(btn);
    });
    
    if (alreadyAnswered) {
        explanationContentEl.innerHTML = q.explanation;
        explanationBoxEl.classList.add('show');
    } else {
        explanationBoxEl.classList.remove('show');
    }
    
    updateJumpPanelUI();
    updateScoreBoard();
}

function selectOption(selectedIndex) {
    if (userAnswers[currentQuestion] !== null) return;
    
    const q = quizData[currentQuestion];
    const buttons = optionsGridEl.getElementsByTagName('button');
    const isCorrect = (selectedIndex === q.answer);
    userAnswers[currentQuestion] = isCorrect; // 紀錄對錯布林值
    
    if (isCorrect) {
        buttons[selectedIndex].classList.add('correct');
    } else {
        buttons[selectedIndex].classList.add('incorrect');
        buttons[q.answer].classList.add('correct');
    }
    
    for (let btn of buttons) {
        btn.disabled = true;
    }
    
    explanationContentEl.innerHTML = q.explanation;
    explanationBoxEl.classList.add('show');
    
    updateJumpPanelUI();
    updateScoreBoard();
}

function nextQuestion() {
    if (currentQuestion < quizData.length - 1) {
        currentQuestion++;
        loadQuestion();
    } else {
        checkFinish();
    }
}

function prevQuestion() {
    if (currentQuestion > 0) {
        currentQuestion--;
        loadQuestion();
    }
}

function goToQuestion(index) {
    currentQuestion = index;
    loadQuestion();
}

function checkFinish() {
    let answeredCount = userAnswers.filter(ans => ans !== null).length;
    if (answeredCount < quizData.length) {
        if (!confirm(`還有 ${quizData.length - answeredCount} 題尚未作答，確定要查看總成績嗎？`)) {
            return;
        }
    }
    showScore();
}

function showScore() {
    quizContainerEl.style.display = 'none';
    document.querySelector('.jump-panel').style.display = 'none';
    document.querySelector('.score-board').style.display = 'none';
    document.querySelector('.vocab-panel').style.display = 'none';
    scoreCardEl.style.display = 'block';
    
    let correctCount = userAnswers.filter(ans => ans === true).length;
    finalScoreEl.innerHTML = `你完成了全部 50 道日文綜合實戰特訓！<br>最終得分：<strong>${correctCount} / ${quizData.length}</strong> 題`;
    progressBarEl.style.width = '100%';
}

function restartQuiz() {
    currentQuestion = 0;
    userAnswers = new Array(quizData.length).fill(null);
    quizContainerEl.style.display = 'block';
    document.querySelector('.jump-panel').style.display = 'block';
    document.querySelector('.score-board').style.display = 'flex';
    document.querySelector('.vocab-panel').style.display = 'block';
    scoreCardEl.style.display = 'none';
    initJumpPanel();
    loadQuestion();
}

// 初始化執行
initJumpPanel();
loadQuestion();

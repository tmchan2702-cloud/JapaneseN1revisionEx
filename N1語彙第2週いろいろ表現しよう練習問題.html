                <button onclick="switchTab('quiz')" id="btn-tab-quiz" class="bg-indigo-600 hover:bg-indigo-500 text-xs px-3 py-1.5 rounded font-bold transition">實戰測驗</button>
                <button onclick="switchTab('flashcard')" id="btn-tab-flashcard" class="bg-indigo-800 hover:bg-indigo-600 text-xs px-3 py-1.5 rounded transition">生字速查卡片</button>

            </div>
        </div>
    </header>

                </div>
            </div>

            <!-- 答題卡片面板 -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8 flex-grow flex flex-col justify-between">
                <div>
                    <!-- 題號與類型標籤 -->

                        <span id="q-type-tag" class="text-xs font-semibold uppercase tracking-wider text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded">類型</span>
                        <span id="q-number-indicator" class="text-sm font-bold text-slate-400">第 1 / 50 題</span>
                    </div>
                    
                    <!-- 題目敘述 -->
                    <h3 id="question-text" class="text-lg md:text-xl font-medium mb-3 text-slate-900 leading-relaxed">載入中...</h3>
                    
                    <!-- 全句中文翻譯 -->
                    <div class="mb-6 bg-slate-50 border-l-4 border-indigo-500 p-3 rounded-r text-sm text-slate-600">
                        <span class="font-bold text-slate-700">【中文翻譯】：</span><span id="question-translation">載入中...</span>
                    </div>

                    <!-- 選項區 -->
                    <div id="options-container" class="space-y-3 mb-6">
                        <!-- 選項按鈕由 JS 動態生成 -->
                    </div>
                </div>

                <!-- 解析與導航按鈕 -->
                <div>
                    <div id="explanation-box" class="hidden mb-6 bg-amber-50 border border-amber-200 rounded-xl p-4 text-sm text-slate-700 space-y-2">
                        <div class="font-bold text-amber-900 flex items-center gap-1">💡 詳細解析</div>
                        <div id="explanation-text"></div>
                        <div id="options-breakdown" class="mt-3 pt-3 border-t border-amber-200/60 space-y-1 text-xs"></div>
                    </div>

                    <div class="flex justify-between items-center pt-4 border-t border-slate-100">
                        <button onclick="prevQuestion()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium px-5 py-2 rounded-xl transition text-sm">上一題</button>
                        <button onclick="nextQuestion()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-6 py-2 rounded-xl transition text-sm shadow-sm">下一題</button>
                    </div>
                </div>
            </div>
        </div>

            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8">

                    <!-- 卡片由 JS 產生 -->

            </div>

            { type: "【N1 綜合實戰】", q: "第 33 題：その二人のデザインは、どこか(  )ところがある。", translation: "這兩個人的設計，有些地方十分相似、大同小異。", options: ["似たり寄ったりな", "一石二鳥な", "多種多様な", "波乱万丈な"], answer: 0, explanation: "「似たり寄ったり」意指半斤八兩、差不多。", breakdown: ["① 似たり寄ったりな：差不多、半斤八兩【正確答案】", "② 一石二鳥な：一石二鳥", "③ 多種多様な：多種多樣", "④ 波乱万丈な：波瀾萬丈"] },
            { type: "【N1 綜合實戰】", q: "第 34 題：彼は(  )性格で、一度決めたら曲げない。", translation: "他個性頑固，一旦決定了就絕不改變。", options: ["頑固な", "気さくな", "おだやかな", "大らかな"], answer: 0, explanation: "「頑固（がんこ）」意指頑固、固執。", breakdown: ["① 頑固な：頑固、固執【正確答案】", "② 気さくな：爽朗的", "③ おだやかな：溫和的", "④ 大らかな：大氣的"] },

            { type: "【N1 綜合實戰】", q: "第 36 題：夜道で突然の物音に(  )しまった。", translation: "在夜路中被突如其來的聲音嚇了一跳。", options: ["びくっとして", "すっきりと", "ぐっすりと", "さっぱりと"], answer: 0, explanation: "「びくっとする」意指嚇了一大跳、猛然一驚。", breakdown: ["① びくっとして：嚇一跳【正確答案】", "② すっきりと：清爽地", "③ ぐっすりと：沉睡地", "④ さっぱりと：乾脆地"] },
            { type: "【N1 綜合實戰】", q: "第 37 題：この地方の冬は(  )寒さが厳しい。", translation: "這個地方的冬天寒冷程度極其嚴重。", options: ["甚だしい", "みすぼらしい", "はかない", "まぎらわしい"], answer: 0, explanation: "「甚だしい（はなはだしい）」意指甚劇、極端、嚴重。", breakdown: ["① 甚だしい：甚劇、嚴重【正確答案】", "② みすぼらしい：寒酸的", "③ はかない：虛幻的", "④ まぎらわしい：易混淆的"] },
            { type: "【N1 綜合實戰】", q: "第 38 題：彼女の意見は(  )正論と言える。", translation: "她的意見可以說是完全正確的正論。", options: ["まともな", "いい加減な", "ぞんざいな", "ばかばかしい"], answer: 0, explanation: "「まとも」意指正面、正經、正常。", breakdown: ["① まともな：正經、正常的【正確答案】", "② いい加減な：敷衍的", "③ ぞんざいな：粗魯的", "④ ばかばかしい：荒謬的"] },
            { type: "【N1 綜合實戰】", q: "第 39 題：彼の才能は(  )ものがある。", translation: "他的才能有著極其令人驚嘆的部分。", options: ["尋常ではない", "何気ない", "心細い", "物足りない"], answer: 0, explanation: "「尋常ではない（じんじょうではない）」意指非比尋常、不同凡響。", breakdown: ["① 尋常ではない：非比尋常【正確答案】", "② 何気ない：不經意的", "③ 心細い：不安的", "④ 物足りない：不滿足的"] },
            { type: "【N1 綜合實戰】", q: "第 40 題：この計画には(  )問題点が隠されている。", translation: "這個計畫中隱藏著複雜且容易混淆的問題點。", options: ["まぎらわしい", "香ばしい", "香しい", "愛おしい"], answer: 0, explanation: "「紛らわしい（まぎらわしい）」意指容易混淆、難以分辨。", breakdown: ["① まぎらわしい：容易混淆【正確答案】", "② 香ばしい：香氣撲鼻的", "③ 香しい：芬芳的", "④ 愛おしい：可愛的"] },
            { type: "【N1 綜合實戰】", q: "第 41 題：彼は(  )様子で、失敗を全然気にしていない。", translation: "他一副若無其事、毫不介意失敗的樣子。", options: ["何気ない", "頼もしい", "待ち遠しい", "煙たい"], answer: 0, explanation: "「何気ない（なにげない）」意指若無其事、不經意。", breakdown: ["① 何気ない：若無其事【正確答案】", "② 頼もしい：可靠的", "③ 待ち遠しい：期盼的", "④ 煙たい：令人拘束的"] },
            { type: "【N1 綜合實戰】", q: "第 42 題：努力が(  )に終わってしまい、非常に残念だ。", translation: "努力最後落得一場空（白費心機），非常遺憾。", options: ["水泡に帰す / 徒勞", "水の泡", "破綻", "挫折"], answer: 1, explanation: "「水の泡（みずのあわ）」意指化為烏有、白費。", breakdown: ["① 水の泡：水泡、白費【正確答案】", "② 順風満帆：一帆風順", "③ 一期一会：一期一會", "④ 電光石火：電光石火"] },
            { type: "【N1 綜合實戰】", q: "第 43 題：今回のスキャンダルで彼の評判は(  )に落ちた。", translation: "因為這次的醜聞，他的名聲一落千丈。", options: ["地に落ちた", "天に昇った", "海に沈んだ", "山を越えた"], answer: 0, explanation: "「地に落ちる」為固定慣用語，意指名譽掃地、一落千丈。", breakdown: ["① 地に落ちた：落空、名譽掃地【正確答案】", "② 天に昇った：升天", "③ 海に沈んだ：沉海", "④ 山を越えた：度過難關"] },
            { type: "【N1 綜合實戰】", q: "第 44 題：このプロジェクトを成功させるには(  )の協力が必要だ。", translation: "要讓這個專案成功，需要所有的、每種力量的合作。", options: ["あらゆる", "いかなる", "いかに", "もしも"], answer: 0, explanation: "「あらゆる」意指所有的、每種的。", breakdown: ["① あらゆる：所有的【正確答案】", "② いかなる：無論什麼樣的", "③ いかに：如何", "④ もしも：如果"] },
            { type: "【N1 綜合實戰】", q: "第 45 題：(  )困難に直面しても、私たちは諦めない。", translation: "無論面臨什麼樣的困難，我們都不會放棄。", options: ["いかなる", "あらゆる", "あたかも", "いわゆる"], answer: 0, explanation: "「いかなる」意指無論怎樣的、不管什麼樣的。", breakdown: ["① いかなる：無論怎樣的【正確答案】", "② あらゆる：所有的", "③ あたかも：彷彿", "④ いわゆる：所謂的"] },
            { type: "【N1 綜合實戰】", q: "第 46 題：彼の説明は(  )事実と異なる部分がある。", translation: "他的說明與事實有若干程度的差異。", options: ["若干", "ひそか", "めった", "わずか"], answer: 0, explanation: "「若干（じゃっかん）」意指若干、少許。", breakdown: ["① 若干：若干、少許【正確答案】", "② ひそか：祕密", "③ めった：稀少（後接否定）", "④ わずか：僅僅"] },
            { type: "【N1 綜合實戰】", q: "第 47 題：彼は(  )冗談を言って周囲を笑わせた。", translation: "他開了個誇張的玩笑，逗得大家笑出來。", options: ["大げさな", "粗大な", "軽率な", "強引な"], answer: 0, explanation: "「大げさ（おおげさ）」意指誇張、小題大作。", breakdown: ["① 大げさな：誇張的【正確答案】", "② 粗大な：粗大的", "③ 軽率な：輕率的", "④ 強引な：強硬的"] },
            { type: "【N1 綜合實戰】", q: "第 48 題：人生は(  )ものであるから、今を大切に生きよう。", translation: "人生是短暫虛幻的，所以要好好珍惜現在活著。", options: ["はかない", "香ばしい", "芳しい", "心強い"], answer: 0, explanation: "「儚い（はかない）」意指虛幻、短暫、無常。", breakdown: ["① はかない：虛幻、短暫【正確答案】", "② 香ばしい：香氣濃郁的", "③ 芳しい：芬芳的", "④ 心強い：安心的"] },
            { type: "【N1 綜合實戰】", q: "第 49 題：彼女は(  )微笑みを浮かべて部屋を出て行った。", translation: "她浮現出淡淡的微笑，離開了房間。", options: ["かすかな", "ささやかな", "なごやかな", "のどかな"], answer: 0, explanation: "「かすか（微か）」意指微弱的、隱約的。", breakdown: ["① かすかな：微弱、隱約的【正確答案】", "② ささやかな：微小的", "③ なごやかな：和睦的", "④ のどかな：悠閒的"] },
            { type: "【N1 綜合實戰】", q: "第 50 題：その計画は(  )段階で中止になってしまった。", translation: "那個計畫在半途而廢、不徹底的階段就中止了。", options: ["中途半端な", "おおまかな", "でたらめな", "いい加減な"], answer: 0, explanation: "「中途半端（ちゅうとはんぱ）」意指半途而廢、不徹底、不上不下。", breakdown: ["① 中途半端な：半途而廢、不上不下【正確答案】", "② おおまかな：大致的", "③ でたらめな：胡說八道的", "④ いい加減な：敷衍的"] }
        ];

        let currentIdx = 0;
        let userAnswers = new Array(quizData.length).fill(null);

        // 切換介面 (Tab Switcher)
        function switchTab(viewName) {
            const quizView = document.getElementById('quiz-view');
            const flashcardView = document.getElementById('flashcard-view');
            const btnQuiz = document.getElementById('btn-tab-quiz');
            const btnFlashcard = document.getElementById('btn-tab-flashcard');

            if (viewName === 'quiz') {
                quizView.classList.remove('hidden');
                flashcardView.classList.add('hidden');
                btnQuiz.className = "bg-indigo-600 hover:bg-indigo-500 text-xs px-3 py-1.5 rounded font-bold transition";
                btnFlashcard.className = "bg-indigo-800 hover:bg-indigo-600 text-xs px-3 py-1.5 rounded transition";
            } else {
                quizView.classList.add('hidden');
                flashcardView.classList.remove('hidden');
                btnFlashcard.className = "bg-indigo-600 hover:bg-indigo-500 text-xs px-3 py-1.5 rounded font-bold transition";
                btnQuiz.className = "bg-indigo-800 hover:bg-indigo-600 text-xs px-3 py-1.5 rounded transition";
                renderFlashcards('all');
            }
        }

        // 渲染 Flashcards
        function renderFlashcards(dayFilter) {
            const grid = document.getElementById('flashcard-grid');
            grid.innerHTML = '';
            
            const filtered = dayFilter === 'all' 
                ? flashcardData 
                : flashcardData.filter(item => item.day === dayFilter);

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = "bg-slate-50 border border-slate-200 rounded-xl p-4 hover:shadow-md transition flex flex-col justify-between";
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-xs font-bold bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded">Day ${item.day}</span>
                            <span class="text-xs text-slate-400">${item.type}</span>
                        </div>
                        <h3 class="text-lg font-bold text-slate-900">${item.word}</h3>
                        <p class="text-xs text-indigo-600 font-medium mb-2">[ ${item.reading} ]</p>
                    </div>
                    <div class="pt-3 border-t border-slate-200 text-sm text-slate-700 font-medium">
                        ${item.meaning}
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterFlashcards(day) {
            renderFlashcards(day);
        }

        // 初始化測驗
        function initQuiz() {
            renderNavGrid();
            loadQuestion();
        }

        function renderNavGrid() {
            const grid = document.getElementById('nav-grid');
            grid.innerHTML = '';
            quizData.forEach((_, idx) => {
                const btn = document.createElement('button');
                btn.id = `nav-btn-${idx}`;
                btn.className = "h-8 rounded text-xs font-bold transition flex items-center justify-center border ";
                
                if (userAnswers[idx] === null) {
                    btn.className += "bg-white border-slate-200 text-slate-600 hover:border-indigo-400";
                } else if (userAnswers[idx] === quizData[idx].answer) {
                    btn.className += "bg-emerald-500 border-emerald-600 text-white";
                } else {
                    btn.className += "bg-rose-500 border-rose-600 text-white";
                }
                
                if (idx === currentIdx) {
                    btn.className += " ring-2 ring-indigo-600 ring-offset-1";
                }

                btn.innerText = idx + 1;
                btn.onclick = () => goToQuestion(idx);
                grid.appendChild(btn);
            });

            const answeredCount = userAnswers.filter(ans => ans !== null).length;
            document.getElementById('answered-count').innerText = answeredCount;
            document.getElementById('score-badge').innerText = `得分: ${userAnswers.filter((ans, i) => ans === quizData[i].answer).length} / 50`;
        }

        function loadQuestion() {
            const q = quizData[currentIdx];
            document.getElementById('q-type-tag').innerText = q.type;
            document.getElementById('q-number-indicator').innerText = `第 ${currentIdx + 1} / 50 題`;
            document.getElementById('question-text').innerText = q.q;
            document.getElementById('question-translation').innerText = q.translation;

            const container = document.getElementById('options-container');
            container.innerHTML = '';

            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-4 rounded-xl border transition flex items-center justify-between font-medium ";
                
                const isAnswered = userAnswers[currentIdx] !== null;
                const userChoice = userAnswers[currentIdx];

                if (!isAnswered) {
                    btn.className += "border-slate-200 bg-white hover:border-indigo-500 hover:bg-indigo-50/40 text-slate-700";
                } else {
                    if (idx === q.answer) {
                        btn.className += "border-emerald-500 bg-emerald-50 text-emerald-900";
                    } else if (idx === userChoice && userChoice !== q.answer) {
                        btn.className += "border-rose-500 bg-rose-50 text-rose-900";
                    } else {
                        btn.className += "border-slate-200 bg-slate-50 text-slate-400 opacity-60";
                    }
                }

                btn.innerHTML = `<span>${opt}</span><span class="text-xs text-slate-400">選項 ${['A','B','C','D'][idx]}</span>`;
                btn.onclick = () => selectOption(idx);
                container.appendChild(btn);
            });

            const expBox = document.getElementById('explanation-box');
            if (userAnswers[currentIdx] !== null) {
                expBox.classList.remove('hidden');
                document.getElementById('explanation-text').innerText = q.explanation;
                
                const breakdownContainer = document.getElementById('options-breakdown');
                breakdownContainer.innerHTML = '<div class="font-bold text-slate-700 mb-1">選項逐一解析：</div>' + 
                    q.breakdown.map(b => `<div>• ${b}</div>`).join('');
            } else {
                expBox.classList.add('hidden');
            }

            renderNavGrid();
        }

        function selectOption(idx) {
            if (userAnswers[currentIdx] !== null) return;
            userAnswers[currentIdx] = idx;
            loadQuestion();
        }

        function goToQuestion(idx) {
            currentIdx = idx;
            loadQuestion();
        }

        function nextQuestion() {
            if (currentIdx < quizData.length - 1) {
                currentIdx++;
                loadQuestion();
            }
        }

        function prevQuestion() {
            if (currentIdx > 0) {
                currentIdx--;
                loadQuestion();
            }
        }

        function resetQuiz() {
            if (confirm('確定要重新開始所有測驗嗎？')) {
                userAnswers = new Array(quizData.length).fill(null);
                currentIdx = 0;
                initQuiz();
            }
        }

        window.onload = initQuiz;
    </script>
</body>

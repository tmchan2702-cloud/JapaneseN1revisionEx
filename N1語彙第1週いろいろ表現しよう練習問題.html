<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>第1週いろいろ表現しよう日文核心字彙特訓 (50題精修版)</title>
  <!-- 引入你喜歡的 Google Fonts (Shippori Mincho 與 Zen Kaku Gothic 新黑體) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet" />
  
  <style>
    /* 核心美學與變數定義 */
    :root {
      --bg: #f5efe3;
      --paper: #fffdf9;
      --ink: #2c241d;
      --ink-light: #6b5b4f;
      --accent: #b8432f; /* 朱印紅 */
      --accent-hover: #963423;
      --accent-light: #f7e6e2;
      --border: #e2d6c5;
      --ok: #2e6f40;
      --ng: #b8432f;
      --shadow: 0 10px 30px -10px rgba(44, 36, 29, 0.08);
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--ink);
      font-family: 'Zen Kaku Gothic New', 'Noto Sans TC', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* 紙張雜訊背景特效 */
    .grain {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 999;
    }

    /* 頂部 masthead */
    .masthead {
      background: var(--paper);
      border-bottom: 2px solid var(--border);
      padding: 2rem 2rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    .masthead-vertical {
      position: absolute;
      right: 2rem;
      top: 50%;
      transform: translateY(-50%);
      font-family: 'Shippori Mincho B1', serif;
      font-size: 5rem;
      color: var(--border);
      opacity: 0.4;
      user-select: none;
      pointer-events: none;
      writing-mode: vertical-rl;
      letter-spacing: 0.2em;
    }

    .eyebrow {
      font-size: 0.85rem;
      letter-spacing: 0.15em;
      color: var(--accent);
      font-weight: 700;
      margin-bottom: 0.3rem;
    }

    h1 {
      font-family: 'Shippori Mincho B1', serif;
      font-size: 1.8rem;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    h1 .count {
      font-size: 0.9rem;
      background: var(--accent-light);
      color: var(--accent);
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      font-family: 'Zen Kaku Gothic New', sans-serif;
    }

    .lede {
      font-size: 0.95rem;
      color: var(--ink-light);
      margin-top: 0.4rem;
      max-width: 600px;
    }

    /* 朱印風計分器 */
    .hanko {
      width: 70px;
      height: 70px;
      border: 3px solid var(--accent);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--paper);
      color: var(--accent);
      transform: rotate(3deg);
      box-shadow: 0 4px 12px rgba(184, 67, 47, 0.12);
      z-index: 2;
    }

    .hanko-score {
      font-family: 'Shippori Mincho B1', serif;
      font-size: 1.6rem;
      font-weight: 800;
      line-height: 1;
    }

    .hanko-label {
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      font-weight: 700;
    }

    /* 主網格佈局 */
    .layout {
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 2rem 1.5rem;
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 2rem;
      flex-grow: 1;
    }

    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }

    /* 答題舞台區 */
    .stage {
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2.5rem;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .stage-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .tag {
      background: var(--accent-light);
      color: var(--accent);
      font-size: 0.8rem;
      padding: 0.3rem 0.8rem;
      border-radius: 6px;
      font-weight: 700;
    }

    .q-num {
      font-size: 0.9rem;
      color: var(--ink-light);
      font-weight: 500;
    }

    /* 進度條 */
    .progress {
      width: 100%;
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.3s ease;
    }

    /* 題目卡 */
    .question-card {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .question {
      font-family: 'Shippori Mincho B1', serif;
      font-size: 1.35rem;
      line-height: 1.8;
      color: var(--ink);
    }

    /* 選項群組 */
    .options {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    .option-btn {
      width: 100%;
      text-align: left;
      padding: 1rem 1.25rem;
      background: var(--paper);
      border: 2px solid var(--border);
      border-radius: 10px;
      font-size: 1rem;
      color: var(--ink);
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--accent);
      background: var(--accent-light);
    }

    .option-btn.correct {
      background: #edf7ed !important;
      border-color: var(--ok) !important;
      color: var(--ok) !important;
      font-weight: 700;
    }

    .option-btn.wrong {
      background: #fdf2f2 !important;
      border-color: var(--ng) !important;
      color: var(--ng) !important;
    }

    .option-btn.disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* 解析面板 */
    .explanation {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.5rem;
      margin-top: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .verdict {
      font-family: 'Shippori Mincho B1', serif;
      font-size: 1.1rem;
      font-weight: bold;
    }

    dl {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    dt {
      font-weight: 700;
      color: var(--accent);
      font-size: 0.9rem;
    }

    dd {
      color: var(--ink-light);
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .notes {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      margin-top: 0.3rem;
    }

    .notes li {
      font-size: 0.9rem;
    }

    /* 控制按鈕列 */
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
    }

    .btn {
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
    }

    .btn.ghost {
      background: transparent;
      border: 2px solid var(--border);
      color: var(--ink-light);
    }

    .btn.ghost:hover {
      border-color: var(--ink);
      color: var(--ink);
    }

    .btn.primary {
      background: var(--accent);
      border: 2px solid var(--accent);
      color: #fff;
    }

    .btn.primary:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    .kbd-hint {
      font-size: 0.8rem;
      color: var(--ink-light);
    }

    /* 側欄 (題目一覽與生字卡) */
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .panel {
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: var(--shadow);
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
    }

    .panel-head h2 {
      font-family: 'Shippori Mincho B1', serif;
      font-size: 1.1rem;
    }

    .panel-meta {
      font-size: 0.8rem;
      color: var(--ink-light);
    }

    /* 50題跳轉格子 */
    .jump-grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 5px;
      margin-bottom: 1rem;
    }

    .jump-btn {
      aspect-ratio: 1;
      border: 1px solid var(--border);
      background: var(--bg);
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink-light);
      transition: all 0.15s;
    }

    .jump-btn:hover {
      border-color: var(--accent);
    }

    .jump-btn.current {
      border-color: var(--accent);
      background: var(--accent-light);
      color: var(--accent);
    }

    .jump-btn.ok {
      background: var(--ok);
      border-color: var(--ok);
      color: #fff;
    }

    .jump-btn.ng {
      background: var(--ng);
      border-color: var(--ng);
      color: #fff;
    }

    .legend {
      display: flex;
      justify-content: space-around;
      font-size: 0.75rem;
      color: var(--ink-light);
      padding-top: 0.5rem;
      border-top: 1px solid var(--border);
    }

    .legend span {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }

    .dot.ok { background: var(--ok); }
    .dot.ng { background: var(--ng); }
    .dot.cur { background: var(--accent); }

    /* 生字速查卡面板 */
    .vocab .day-tabs {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      padding-bottom: 0.5rem;
      margin-bottom: 1rem;
    }

    .day-tab {
      padding: 0.3rem 0.6rem;
      font-size: 0.75rem;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: var(--bg);
      cursor: pointer;
      white-space: nowrap;
      font-weight: 700;
      color: var(--ink-light);
    }

    .day-tab.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .vocab-list {
      list-style: none;
      max-height: 250px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      padding-right: 0.4rem;
    }

    .vocab-item {
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 0.6rem;
      border-radius: 6px;
      font-size: 0.85rem;
    }

    .vocab-item .word {
      font-weight: 700;
      color: var(--accent);
    }

    .vocab-item .meaning {
      font-size: 0.75rem;
      color: var(--ink-light);
      margin-top: 2px;
    }

    /* 頁尾 */
    .footer {
      text-align: center;
      padding: 1.5rem;
      font-size: 0.8rem;
      color: var(--ink-light);
      border-top: 1px solid var(--border);
      background: var(--paper);
    }
  </style>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <!-- 頂部資訊列 -->
  <header class="masthead">
    <div class="masthead-vertical" aria-hidden="true">核心字彙・50題</div>
    <div class="masthead-text">
      <p class="eyebrow">JLPT 語彙 ／ 精修特訓第1週いろいろ表現しよう</p>
      <h1>第1週いろいろ表現しよう日文核心字彙特訓 <span class="count">五十題</span></h1>
      <p class="lede">詞義辨析、漢字讀音與生字填充三種題型。作答後立即顯示全句翻譯與選項解析，進度自動儲存於本機。</p>
    </div>
    <div class="hanko" id="hanko">
      <span class="hanko-score" id="hanko-score">0</span>
      <span class="hanko-label">正解</span>
    </div>
  </header>

  <!-- 主內容區 -->
  <main class="layout">
    <!-- 左側：答題舞台區 -->
    <section class="stage" aria-label="測驗舞台">
      <div class="stage-top">
        <span class="tag" id="q-category">載入中...</span>
        <span class="q-num" id="q-num">第 1 題 ／ 共 50 題</span>
      </div>
      <div class="progress" aria-hidden="true"><div class="progress-fill" id="progress"></div></div>

      <div class="question-card">
        <p class="question" id="q-text" lang="ja">載入題目中...</p>
        
        <!-- 選項區 -->
        <div class="options" id="options" role="group" aria-label="選項"></div>

        <!-- 解析面板 (預設隱藏) -->
        <div class="explanation" id="explanation" hidden>
          <div class="verdict" id="verdict"></div>
          <dl>
            <dt>全句翻譯</dt>
            <dd id="translation"></dd>
            <dt>選項解析</dt>
            <dd><ul class="notes" id="notes"></ul></dd>
          </dl>
        </div>
      </div>

      <nav class="controls">
        <button class="btn ghost" id="prev-btn" type="button" onclick="prevQuestion()">← 上一題</button>
        <span class="kbd-hint">提示：點擊選項即時對答案</span>
        <button class="btn primary" id="next-btn" type="button" onclick="nextQuestion()">下一題 →</button>
      </nav>
    </section>

    <!-- 右側：側欄導航與生字卡 -->
    <aside class="sidebar">
      <div class="panel">
        <div class="panel-head">
          <h2>題目導航方格</h2>
          <span class="panel-meta" id="answered-count">已作答 0 ／ 50</span>
        </div>
        <div class="jump-grid" id="jump-grid"></div>
        <div class="legend">
          <span><i class="dot ok"></i>答對</span>
          <span><i class="dot ng"></i>答錯</span>
          <span><i class="dot cur"></i>目前</span>
        </div>
      </div>

      <div class="panel vocab">
        <div class="panel-head">
          <h2>生字速查卡</h2>
          <span class="panel-meta">第1週1日目〜6日目</span>
        </div>
        <div class="day-tabs" id="day-tabs" role="tablist">
          <button class="day-tab active" onclick="switchDay(1)" data-day="1">1日目</button>
          <button class="day-tab" onclick="switchDay(2)" data-day="2">2日目</button>
          <button class="day-tab" onclick="switchDay(3)" data-day="3">3日目</button>
          <button class="day-tab" onclick="switchDay(4)" data-day="4">4日目</button>
          <button class="day-tab" onclick="switchDay(5)" data-day="5">5日目</button>
          <button class="day-tab" onclick="switchDay(6)" data-day="6">6日目</button>
        </div>
        <ul class="vocab-list" id="vocab-list" lang="ja"></ul>
      </div>
    </aside>
  </main>

  <footer class="footer">日文核心字彙線上溫習系統 &copy; 2026 ・ 作答紀錄僅保存於本機瀏覽器</footer>

  <script>
    // 50 題題庫資料
    const questions = [
      {
        id: 1, category: "1日目 漢字與平假名轉換",
        text: "私(わたし)の夫(おっと)はとても金(かね)づかいが (      )。",
        options: [
          { label: "A", text: "まめな", correct: false },
          { label: "B", text: "荒い (あらい)", correct: true },
          { label: "C", text: "ルーズな", correct: false },
          { label: "D", text: "気さくな", correct: false }
        ],
        translation: "我的丈夫非常花錢大手大腳（金づかいが荒い）。",
        analysis: {
          A: "「まめな」指勤勉、勤快。",
          B: "【正確答案】「金づかいが荒い」為固定搭配，意指「揮金如土、花錢大手大腳」。",
          C: "「ルーズな」指散漫、鬆懈。",
          D: "「気さくな」指爽朗、平易近人。"
        }
      },
      {
        id: 2, category: "1日目 生字填充",
        text: "彼はちょっと時間に (      ) ところがあるから、待ち合わせには注意してね。",
        options: [
          { label: "A", text: "ルーズな", correct: true },
          { label: "B", text: "誠実な", correct: false },
          { label: "C", text: "生真面目な", correct: false },
          { label: "D", text: "おおらかな", correct: false }
        ],
        translation: "他這人有些時間觀念鬆懈（ルーズな），所以約會時要注意喔。",
        analysis: {
          A: "【正確答案】「ルーズな」源自英文 loose，形容散漫、鬆懈、對時間或規矩不嚴格。",
          B: "「誠実な」指誠實、真摯。",
          C: "「生真面目な」指非常認真、古板。",
          D: "「おおらかな」指心胸寬廣、不拘小節。"
        }
      },
      {
        id: 3, category: "1日目 詞義辨析",
        text: "彼女は大スターなのに、とても (      ) 人です。誰とでも気兼ねなく話せます。",
        options: [

          { label: "B", text: "気さくな", correct: true },
          { label: "C", text: "陰気な", correct: false },
          { label: "D", text: "傲慢な", correct: false }
        ],
        translation: "她雖然是大明星，卻是個非常平易近人（気さくな）的人。",
        analysis: {
          A: "「近寄りがたい」指難以靠近。",

          C: "「陰気な」指陰鬱、憂鬱。",
          D: "「傲慢な」指傲慢。"
        }
      },
      {
        id: 4, category: "1日目 漢字與平假名轉換",
        text: "豪華で (      ) 輝きの宝石を目の当たりにした。",
        options: [
          { label: "A", text: "色気のある", correct: false },
          { label: "B", text: "気品のある (きひんのある)", correct: true },
          { label: "C", text: "素朴な", correct: false },
          { label: "D", text: "無邪気な", correct: false }
        ],
        translation: "親眼見到了散發豪華且有氣派（気品のある）光芒的寶石。",
        analysis: {
          A: "「色気がある」指有性感魅力。",
          B: "【正確答案】「気品がある」意指有氣派、有高雅的品味與氣質。",
          C: "「素朴な」指樸素、質樸。",
          D: "「無邪気な」指天真爛漫。"
        }
      },
      {
        id: 5, category: "1日目 生字填充",
        text: "あまりお金に (      ) 人は、周りから嫌われてしまいますよ。",
        options: [
          { label: "A", text: "でしゃばりな", correct: false },
          { label: "B", text: "意地悪な", correct: false },
          { label: "C", text: "いやしい (卑しい)", correct: true },
          { label: "D", text: "きざな", correct: false }
        ],
        translation: "對金錢太過卑鄙吝嗇/貪婪（いやしい）的人，會被周圍的人討厭喔。",
        analysis: {
          A: "「でしゃばりな」指愛出風頭、多管閒事。",
          B: "「意地悪な」指壞心眼。",
          C: "【正確答案】「いやしい（卑しい）」在此形容對金錢或食物貪婪、下流、卑鄙。",
          D: "「きざな」指矯揉造作、裝腔作勢。"
        }
      },
      {
        id: 6, category: "1日目 慣用表現辨析",
        text: "あの店員はだれにでも (      )ので、お客さんにとても人気があります。",

        { word: "便秘になる", reading: "べんぴになる", meaning: "便秘" },
        { word: "妊娠する", reading: "にんしんする", meaning: "懷孕" },
        { word: "出産する / お産", reading: "しゅっさんする / おさん", meaning: "生產、分娩" },
        { word: "歯を矯正する", reading: "はをきょうせいする", meaning: "矯正牙齒" },
        { word: "湿疹ができる", reading: "しっしんができる", meaning: "長濕疹" },
        { word: "皮膚をかく", reading: "ひふをかく", meaning: "抓皮膚" },
        { word: "病気の進行が早まる", reading: "びょうきのしんこうがはやまる", meaning: "病情進展加快" },
        { word: "体が弱る", reading: "からだがよわる", meaning: "身體衰弱" },
        { word: "痛みが強まる / 弱まる", reading: "いたみがつよまる / よわまる", meaning: "疼痛加劇 / 減輕" },
        { word: "痛みを和らげる", reading: "いたみをやわらげる", meaning: "緩解疼痛" },
        { word: "蕁麻疹", reading: "じんましん", meaning: "蕁麻疹" },
        { word: "猫に引っかかれる", reading: "ねこに引っかかれる", meaning: "被貓抓傷" },
        { word: "リハビリを受ける", reading: "リハビリをうける", meaning: "接受復健" },
        { word: "入院する / 退院する", reading: "にゅういんする / たいいんする", meaning: "住院 / 出院" },
        { word: "患者に付き添う", reading: "かんじゃにつきそう", meaning: "陪護患者、隨侍在側" },
        { word: "面会に行く / お見舞いに行く", reading: "めんかいにいく / おみまいにいく", meaning: "去會面 / 去探病" },
        { word: "ガン", reading: "ガン", meaning: "癌症" },
        { word: "ぜんそく（発作）", reading: "ぜんそく（ほっさ）", meaning: "氣喘（發作）" },
        { word: "気管支炎", reading: "きかんしえん", meaning: "支氣管炎" },
        { word: "肺炎", reading: "はいえん", meaning: "肺炎" },
        { word: "皮膚炎", reading: "ひふえん", meaning: "皮膚炎" },
        { word: "うつ病", reading: "うつびょう", meaning: "憂鬱症" },
        { word: "認知症", reading: "にんちしょう", meaning: "失智症、認知症" },
        { word: "熱中症", reading: "ねっちゅうしょう", meaning: "中暑、熱衰竭" },
        { word: "花粉症", reading: "かふんしょう", meaning: "花粉症" }
    ]
};

    let currentIndex = 0;
    let userAnswers = new Array(questions.length).fill(null);
    let score = 0;

    function initApp() {
      renderNavGrid();
      loadQuestion(0);
      switchDay(1);
    }

    // 渲染導航方格
    function renderNavGrid() {
      const gridContainer = document.getElementById("jump-grid");
      gridContainer.innerHTML = "";
      questions.forEach((q, idx) => {
        const btn = document.createElement("button");
        btn.id = `nav-btn-${idx}`;
        btn.className = `jump-btn ${getNavBtnStyle(idx)}`;
        btn.innerText = idx + 1;
        btn.onclick = () => loadQuestion(idx);
        gridContainer.appendChild(btn);
      });
    }

    function getNavBtnStyle(idx) {
      if (idx === currentIndex) return "current";
      if (userAnswers[idx] !== null) {
        const q = questions[idx];
        const correctOpt = q.options.find(o => o.correct).label;
        return userAnswers[idx] === correctOpt ? "ok" : "ng";
      }
      return "";
    }

    // 載入題目
    function loadQuestion(index) {
      currentIndex = index;
      const q = questions[currentIndex];

      document.getElementById("q-category").innerText = q.category;
      document.getElementById("q-num").innerText = `第 ${currentIndex + 1} 題 ／ 共 50 題`;
      document.getElementById("q-text").innerText = q.text;

      // 更新進度條
      const progressPercent = ((currentIndex + 1) / questions.length) * 100;
      document.getElementById("progress").style.width = `${progressPercent}%`;

      // 渲染選項
      const optionsContainer = document.getElementById("options");
      optionsContainer.innerHTML = "";

      q.options.forEach((opt) => {
        const btn = document.createElement("button");
        btn.className = `option-btn ${getOptionClass(currentIndex, opt.label)}`;
        if (userAnswers[currentIndex] !== null) btn.classList.add("disabled");
        btn.innerHTML = `<strong>${opt.label}.</strong> ${opt.text}`;
        btn.onclick = () => selectOption(currentIndex, opt.label);
        optionsContainer.appendChild(btn);
      });

      // 顯示或隱藏解析
      const expBox = document.getElementById("explanation");
      if (userAnswers[currentIndex] !== null) {
        showExplanation(q);
      } else {
        expBox.hidden = true;
      }

      updateNavGridStyles();
    }

    function getOptionClass(qIdx, label) {
      const userAns = userAnswers[qIdx];
      const q = questions[qIdx];
      const correctOpt = q.options.find(o => o.correct).label;

      if (userAns === null) return "";
      if (label === correctOpt) return "correct";
      if (label === userAns) return "wrong";
      return "disabled";
    }

    // 選擇選項
    function selectOption(qIdx, label) {
      if (userAnswers[qIdx] !== null) return;

      userAnswers[qIdx] = label;
      const q = questions[qIdx];
      const correctOpt = q.options.find(o => o.correct).label;

      if (label === correctOpt) {
        score++;
        document.getElementById("hanko-score").innerText = score;
      }

      // 更新已作答數
      const answeredCount = userAnswers.filter(a => a !== null).length;
      document.getElementById("answered-count").innerText = `已作答 ${answeredCount} ／ 50`;

      loadQuestion(qIdx);
    }

    // 顯示解析
    function showExplanation(q) {
      const expBox = document.getElementById("explanation");
      const verdict = document.getElementById("verdict");
      const translation = document.getElementById("translation");
      const notes = document.getElementById("notes");

      const userAns = userAnswers[currentIndex];
      const correctOpt = q.options.find(o => o.correct).label;

      if (userAns === correctOpt) {
        verdict.innerHTML = `<span style="color: var(--ok);">🎉 回答正確！</span>`;
      } else {
        verdict.innerHTML = `<span style="color: var(--ng);">❌ 回答錯誤。正確答案是：${correctOpt} 題</span>`;
      }

      translation.innerText = q.translation;

      notes.innerHTML = "";
      for (let key in q.analysis) {
        const li = document.createElement("li");
        li.innerHTML = `<strong style="color: var(--accent);">${key}:</strong> ${q.analysis[key]}`;
        notes.appendChild(li);
      }

      expBox.hidden = false;
    }

    function updateNavGridStyles() {
      questions.forEach((_, idx) => {
        const btn = document.getElementById(`nav-btn-${idx}`);
        if (btn) {
          btn.className = `jump-btn ${getNavBtnStyle(idx)}`;
        }
      });
    }

    function nextQuestion() {
      if (currentIndex < questions.length - 1) {
        loadQuestion(currentIndex + 1);
      } else {
        alert(`恭喜完成 50 題測驗！您的最終得分為：${score} / 50 分！`);
      }
    }

    function prevQuestion() {
      if (currentIndex > 0) {
        loadQuestion(currentIndex - 1);
      }
    }

    // 切換生字速查卡
    function switchDay(day) {
      const tabs = document.querySelectorAll(".day-tab");
      tabs.forEach(t => {
        if (t.dataset.day == day) {
          t.classList.add("active");
        } else {
          t.classList.remove("active");
        }
      });

      const vocabList = document.getElementById("vocab-list");
      vocabList.innerHTML = "";
      const cards = flashcardData[day] || [];
      cards.forEach(card => {
        const li = document.createElement("li");
        li.className = "vocab-item";
        li.innerHTML = `
          <div class="word">${card.word} <span style="font-size: 0.75rem; color: var(--ink-light); font-weight: normal;">(${card.reading})</span></div>
          <div class="meaning">${card.meaning}</div>
        `;
        vocabList.appendChild(li);
      });
    }

    window.onload = initApp;
  </script>
</body>

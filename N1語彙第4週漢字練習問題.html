<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>N1 漢字語彙・第4週練習問題｜50 題實戰特訓</title>
  <meta name="description" content="日本語能力試驗 N1 漢字語彙第 4 週：全句翻譯、即時評分、選項解析與生字速查卡 50 題實戰特訓。" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect x='4' y='4' width='56' height='56' rx='10' fill='%23b8432f'/><text x='32' y='44' font-size='34' text-anchor='middle' fill='%23f5efe3' font-family='serif'>漢</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f5efe3;
      --paper: #fdfaf3;
      --paper-sub: #f2ebd9;
      --ink: #2c241d;
      --ink-muted: #73675c;
      --primary: #b8432f;
      --primary-hover: #9c3523;
      --accent: #2e5a4c;
      --ok: #2e5a4c;
      --ng: #b8432f;
      --border: #dfd4be;
      --shadow: rgba(44, 36, 29, 0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Zen Kaku Gothic New", sans-serif;
      background-color: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* 質感雜訊紋理 */
    .grain {
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 1000;
    }

    /* 頂部 masthead */
    .masthead {
      background-color: var(--paper);
      border-bottom: 2px solid var(--border);
      padding: 2.5rem 2rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    .masthead-vertical {
      position: absolute;
      right: 3rem;
      top: 50%;
      transform: translateY(-50%);
      font-family: "Shippori Mincho B1", serif;
      font-size: 6rem;
      color: var(--border);
      opacity: 0.4;
      user-select: none;
      letter-spacing: 0.5rem;
      writing-mode: vertical-rl;
    }

    .masthead-text { position: relative; z-index: 2; max-width: 700px; }
    .eyebrow { font-size: 0.85rem; letter-spacing: 0.15em; color: var(--primary); font-weight: 700; margin-bottom: 0.5rem; text-transform: uppercase; }
    h1 { font-family: "Shippori Mincho B1", serif; font-size: 2.2rem; font-weight: 800; color: var(--ink); margin-bottom: 0.75rem; display: flex; align-items: baseline; gap: 1rem; }
    h1 .count { font-size: 1.2rem; color: var(--ink-muted); font-weight: 500; font-family: "Zen Kaku Gothic New", sans-serif; }
    .lede { font-size: 1rem; color: var(--ink-muted); line-height: 1.6; }

    /* 印章計分 */
    .hanko {
      width: 84px; height: 84px; border: 3px solid var(--primary);
      border-radius: 50%; display: flex; flex-direction: column;
      align-items: center; justify-content: center; color: var(--primary);
      background: var(--paper); transform: rotate(-5deg);
      box-shadow: 0 4px 12px rgba(184, 67, 47, 0.15);
      position: relative; z-index: 2; flex-shrink: 0;
    }
    .hanko-score { font-family: "Shippori Mincho B1", serif; font-size: 2rem; font-weight: 800; line-height: 1; }
    .hanko-label { font-size: 0.7rem; letter-spacing: 0.1em; font-weight: 700; }

    /* 主佈局 */
    .layout {
      max-width: 1400px; width: 100%; margin: 2rem auto; padding: 0 1.5rem;
      display: grid; grid-template-columns: 1fr 380px; gap: 2rem; flex: 1;
    }

    @media (max-width: 1024px) {
      .layout { grid-template-columns: 1fr; }
      .masthead-vertical { display: none; }
    }

    /* 測驗舞台 */
    .stage {
      background: var(--paper); border: 1px solid var(--border);
      border-radius: 16px; padding: 2.5rem; box-shadow: 0 10px 30px var(--shadow);
      display: flex; flex-direction: column; justify-content: space-between;
    }

    .stage-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
    .tag { background: var(--paper-sub); color: var(--accent); padding: 0.3rem 0.8rem; border-radius: 20px; font-size: 0.85rem; font-weight: 700; border: 1px solid var(--border); }
    .q-num { font-size: 0.9rem; color: var(--ink-muted); font-weight: 700; }

    .progress { height: 6px; background: var(--paper-sub); border-radius: 3px; overflow: hidden; margin-bottom: 2rem; }
    .progress-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s ease; }

    .question { font-family: "Shippori Mincho B1", serif; font-size: 1.6rem; font-weight: 700; margin-bottom: 2rem; line-height: 1.5; color: var(--ink); }

    /* 選項清單 */
    .options { display: flex; flex-direction: column; gap: 1rem; margin-bottom: 2rem; }
    .option-btn {
      background: var(--paper); border: 2px solid var(--border); border-radius: 12px;
      padding: 1.1rem 1.5rem; font-size: 1.1rem; text-align: left; cursor: pointer;
      font-family: "Zen Kaku Gothic New", sans-serif; font-weight: 500; color: var(--ink);
      transition: all 0.2s ease; display: flex; justify-content: space-between; align-items: center;
    }
    .option-btn:hover:not(:disabled) { border-color: var(--primary); background: var(--paper-sub); transform: translateY(-1px); }
    .option-btn.correct { background: #eaf2ed !important; border-color: var(--ok) !important; color: var(--ok); font-weight: 700; }
    .option-btn.incorrect { background: #faeaea !important; border-color: var(--ng) !important; color: var(--ng); }
    .option-btn:disabled { cursor: default; }

    /* 解析面板 */
    .explanation { background: var(--paper-sub); border-left: 4px solid var(--primary); padding: 1.5rem; border-radius: 0 12px 12px 0; margin-top: 1.5rem; animation: fadeIn 0.3s ease; display: none; }
    .explanation.show { display: block; }
    .verdict { font-family: "Shippori Mincho B1", serif; font-size: 1.2rem; font-weight: 700; margin-bottom: 0.8rem; }
    .verdict.ok { color: var(--ok); }
    .verdict.ng { color: var(--ng); }
    .explanation dt { font-weight: 700; color: var(--ink-muted); font-size: 0.85rem; margin-top: 1rem; text-transform: uppercase; letter-spacing: 0.05em; }
    .explanation dd { font-size: 1rem; line-height: 1.6; margin-top: 0.3rem; }
    .notes { list-style: none; margin-top: 0.5rem; }
    .notes li { position: relative; padding-left: 1.2rem; margin-bottom: 0.4rem; color: var(--ink-muted); }
    .notes li::before { content: "•"; position: absolute; left: 0; color: var(--primary); }

    /* 控制按鈕列 */
    .controls { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding-top: 1.5rem; margin-top: auto; }
    .btn { background: var(--ink); color: var(--paper); border: none; padding: 0.8rem 1.8rem; border-radius: 8px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: background 0.2s; font-family: "Zen Kaku Gothic New", sans-serif; }
    .btn:hover { background: var(--primary); }
    .btn.ghost { background: transparent; color: var(--ink-muted); border: 2px solid var(--border); }
    .btn.ghost:hover { border-color: var(--ink); color: var(--ink); background: transparent; }
    .btn.primary { background: var(--primary); color: #fff; }
    .btn.primary:hover { background: var(--primary-hover); }
    .kbd-hint { font-size: 0.8rem; color: var(--ink-muted); }

    /* 側欄 */
    .sidebar { display: flex; flex-direction: column; gap: 1.5rem; }
    .panel { background: var(--paper); border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem; box-shadow: 0 10px 30px var(--shadow); }
    .panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.2rem; padding-bottom: 0.8rem; border-bottom: 1px solid var(--border); }
    .panel-head h2 { font-family: "Shippori Mincho B1", serif; font-size: 1.2rem; font-weight: 700; }
    .panel-meta { font-size: 0.85rem; color: var(--ink-muted); font-weight: 700; }

    /* 導航方格網格 */
    .jump-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 1.2rem; max-height: 220px; overflow-y: auto; }
    .jump-btn { aspect-ratio: 1; background: var(--paper-sub); border: 1px solid var(--border); border-radius: 6px; font-weight: 700; font-size: 0.9rem; cursor: pointer; color: var(--ink); transition: all 0.2s; }
    .jump-btn:hover { border-color: var(--primary); }
    .jump-btn.correct { background: #eaf2ed; color: var(--ok); border-color: var(--ok); }
    .jump-btn.incorrect { background: #faeaea; color: var(--ng); border-color: var(--ng); }
    .jump-btn.active { border: 2px solid var(--primary); box-shadow: 0 0 0 2px rgba(184,67,47,0.2); }

    .legend { display: flex; justify-content: space-around; font-size: 0.8rem; color: var(--ink-muted); padding-top: 0.5rem; border-top: 1px dashed var(--border); margin-bottom: 1rem; }
    .legend span { display: flex; align-items: center; gap: 4px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .dot.ok { background: var(--ok); }
    .dot.ng { background: var(--ng); }
    .dot.cur { background: var(--primary); }

    .link-btn { width: 100%; background: transparent; border: 2px dashed var(--border); color: var(--ink-muted); padding: 0.7rem; border-radius: 8px; font-weight: 700; cursor: pointer; transition: all 0.2s; font-family: "Zen Kaku Gothic New", sans-serif; }
    .link-btn:hover { border-color: var(--primary); color: var(--primary); background: var(--paper-sub); }

    /* 生字速查卡 */
    .vocab.panel { max-height: 520px; display: flex; flex-direction: column; }
    .day-tabs { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 10px; scrollbar-width: thin; flex-wrap: wrap; }
    .day-tab { background: var(--paper-sub); border: 1px solid var(--border); padding: 4px 10px; border-radius: 4px; font-size: 0.75rem; font-weight: 700; cursor: pointer; white-space: nowrap; color: var(--ink-muted); }
    .day-tab.active { background: var(--primary); color: white; border-color: var(--primary); }
    .vocab-list { list-style: none; overflow-y: auto; flex: 1; padding-right: 4px; display: flex; flex-direction: column; gap: 8px; font-size: 0.85rem; }
    .vocab-list li { background: var(--paper-sub); padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border); }

    /* 成績結算頁面 */
    .results { background: var(--paper); border: 1px solid var(--border); border-radius: 16px; padding: 3rem 2rem; text-align: center; display: none; box-shadow: 0 10px 30px var(--shadow); }
    .results h2 { font-family: "Shippori Mincho B1", serif; font-size: 2rem; margin-bottom: 1rem; color: var(--primary); }
    .result-score { font-size: 3.5rem; font-weight: 800; font-family: "Shippori Mincho B1", serif; color: var(--ink); margin: 1.5rem 0; }
    .result-score span { font-size: 1.5rem; color: var(--ink-muted); font-weight: 500; }
    .result-comment { font-size: 1.1rem; color: var(--ink-muted); margin-bottom: 2rem; line-height: 1.6; }
    .result-actions { display: flex; gap: 1rem; justify-content: center; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <header class="masthead">
    <div class="masthead-vertical" aria-hidden="true">第四週・漢字語彙</div>
    <div class="masthead-text">
      <p class="eyebrow">JLPT N1 語彙 ／ 第 4 週</p>
      <h1>漢字語彙練習問題 <span class="count">50 題</span></h1>
      <p class="lede">涵蓋全句翻譯、即時評分、選項解析與生字速查卡。每題作答後立即顯示全句翻譯與詳細選項解析。</p>
    </div>
    <div class="hanko" id="hanko" aria-live="polite">
      <span class="hanko-score" id="hanko-score">0</span>
      <span class="hanko-label">正解</span>
    </div>
  </header>

  <main class="layout">
    <!-- 題目區 -->
    <section class="stage" id="stage" aria-label="測驗">
      <div>
        <div class="stage-top">
          <span class="tag" id="q-tag">詞義理解</span>
          <span class="q-num" id="q-num">第 1 題 ／ 共 50 題</span>
        </div>
        <div class="progress" aria-hidden="true"><div class="progress-fill" id="progress"></div></div>

        <div class="question-card" id="question-card">
          <p class="question" id="q-text" lang="ja"></p>
          <div class="options" id="options" role="group" aria-label="選項"></div>
          <div class="explanation" id="explanation">
            <div class="verdict" id="verdict"></div>
            <dl>
              <dt>全句翻譯</dt>
              <dd id="translation"></dd>
              <dt>選項解析</dt>
              <dd><ul class="notes" id="notes"></ul></dd>
            </dl>
          </div>
        </div>
      </div>

      <nav class="controls">
        <button class="btn ghost" id="prev-btn" type="button" onclick="prevQuestion()">← 上一題</button>
        <span class="kbd-hint">點擊選項即時作答與看解析</span>
        <button class="btn primary" id="next-btn" type="button" onclick="nextQuestion()">下一題 →</button>
      </nav>
    </section>

    <!-- 結果頁 -->
    <section class="results" id="results" aria-label="成績總結">
      <p class="eyebrow">練習完成</p>
      <h2>第 4 週漢字語彙實戰特訓結算</h2>
      <p class="result-score"><strong id="result-correct">0</strong><span> ／ 50</span></p>
      <p class="result-comment" id="result-desc" style="color: var(--ink-muted);"></p>
      <div class="result-actions">
        <button class="btn primary" id="restart-btn" type="button" onclick="restartQuiz()">重新開始練習</button>
      </div>
    </section>

    <!-- 側欄 -->
    <aside class="sidebar">
      <div class="panel">
        <div class="panel-head">
          <h2>題目一覽</h2>
          <span class="panel-meta" id="answered-count">已作答 0 ／ 50</span>
        </div>
        <div class="jump-grid" id="jump-grid"></div>
        <div class="legend">
          <span><i class="dot ok"></i>答對</span>
          <span><i class="dot ng"></i>答錯</span>
          <span><i class="dot cur"></i>目前</span>
        </div>
        <button class="link-btn" id="finish-btn" type="button" onclick="checkFinish()">查看成績總結</button>
      </div>

      <div class="panel vocab">
        <div class="panel-head">
          <h2>生字速查卡</h2>
          <span class="panel-meta">1日目〜6日目</span>
        </div>
        <div class="day-tabs" id="day-tabs" role="tablist">
          <button class="day-tab active" onclick="switchVocabDay(1)">1日目</button>
          <button class="day-tab" onclick="switchVocabDay(2)">2日目</button>
          <button class="day-tab" onclick="switchVocabDay(3)">3日目</button>
          <button class="day-tab" onclick="switchVocabDay(4)">4日目</button>
          <button class="day-tab" onclick="switchVocabDay(5)">5日目</button>
          <button class="day-tab" onclick="switchVocabDay(6)">6日目</button>
        </div>
        <ul class="vocab-list" id="vocab-list" lang="ja"></ul>
      </div>
    </aside>
  </main>

  <footer style="text-align: center; padding: 2rem; color: var(--ink-muted); font-size: 0.85rem;">
    N1 漢字語彙・第4週練習問題
  </footer>

  <script>
    // 第4週生字速查資料庫
    const vocabData = {
        1: [
            "・整う（ととのう）：整齊、準備就緒、安排妥當",
            "・控える（ひかえる）：節制、克制、等候、備忘",
            "・避ける（さける）：避開、躲避",
            "・抑える（おさえる）：抑制、控制",
            "・減らす（へらす）：減少、減輕",
            "・手分け（てわけ）：分頭、分工",
            "・同い年（おないどし）：同齡、同歲",
            "・心地（ここち）：感覺、心情",

            "・手軽（てがる）：簡單、輕易",
            "・手近（てぢか）：手邊、鄰近"
        ],
        2: [
            "・上回る（うわまわる）：超過、高於",
            "・下回る（したまわる）：低於、少於",
            "・上向く（うわむく）：好轉、向上起色",
            "・下火（したび）：火勢減弱、熱潮平息",
            "・住み心地（すみごこち）：居住舒適感",
            "・上の空（うえのそら）：心不在焉、心猿意馬",

            "・人気（ひとけ）：人的氣息、動靜",

        3: [

            "・大家（たいか / おおや）：大家、名家／房東",

            "・大目（おおめ）：寬大、寬容",

        ],
        4: [
            "・心当たり（こころあたり）：心裡有底、線索",
            "・下心（したごころ）：私心、企圖",
            "・意図（いと）：意圖、打算",

        5: [

            "・野生（やせい）：野生",
            "・長所（ちょうしょ）：長處",
            "・産地（さんち）：產地",
            "・国産（こくさん）：國產",
            "・生産（せいさん）：生產",
            "・不正（ふせい）：不正、不法",
            "・不良（ふりょう）：不良、次品",
            "・特色（とくしょく）：特色",

        6: [

      },
      {
        type: "詞義理解",
        q: "市場に出回っている（ ）品にご注意ください。",
        options: ["不正", "不良", "不明", "不通"],
        answer: 1,
        translation: "請注意市面上流通的不良品（瑕疵品）。",
        details: {
          correct: "「不良品（ふりょうひん）」意為不良品、瑕疵品、次級品。",

      },
      {
        type: "生字填充",
        q: "この地方（ ）のユニークな習慣がある。",
        options: ["特長", "特用", "特有", "特集"],
        answer: 2,
        translation: "這裡有這個地方特有的獨特習俗。",
        details: {
          correct: "「特有（とくゆう）」意為某個地方或群體特有的屬性。",

    let currentQuestion = 0;
    let userAnswers = new Array(quizData.length).fill(null);

    // DOM 元素快取
    const qTagEl = document.getElementById('q-tag');
    const qNumEl = document.getElementById('q-num');
    const qTextEl = document.getElementById('q-text');
    const optionsEl = document.getElementById('options');
    const explanationEl = document.getElementById('explanation');
    const verdictEl = document.getElementById('verdict');
    const translationEl = document.getElementById('translation');
    const notesEl = document.getElementById('notes');
    const progressBarEl = document.getElementById('progress');
    const stageEl = document.getElementById('stage');
    const resultsEl = document.getElementById('results');
    const jumpGridEl = document.getElementById('jump-grid');
    const answeredCountEl = document.getElementById('answered-count');
    const hankoScoreEl = document.getElementById('hanko-score');
    const vocabListEl = document.getElementById('vocab-list');

    // 切換生字速查卡天數
    function switchVocabDay(day) {
      document.querySelectorAll('.day-tab').forEach((tab) => {
        tab.classList.toggle('active', tab.getAttribute('onclick').includes(day));
      });
      vocabListEl.innerHTML = (vocabData[day] || []).map(item => `<li>${item}</li>`).join('');
    }

    // 初始化跳題網格
    function initJumpGrid() {
      jumpGridEl.innerHTML = '';
      quizData.forEach((_, i) => {
        const btn = document.createElement('button');
        btn.className = 'jump-btn';
        btn.innerText = i + 1;
        btn.onclick = () => goToQuestion(i);
        jumpGridEl.appendChild(btn);
      });
      updateJumpGridUI();
    }

    function updateJumpGridUI() {
      const buttons = jumpGridEl.getElementsByClassName('jump-btn');
      let answeredCount = 0;
      let correctCount = 0;

      for (let i = 0; i < buttons.length; i++) {
        buttons[i].className = 'jump-btn';
        if (i === currentQuestion) buttons[i].classList.add('active');
        if (userAnswers[i] === true) {
          buttons[i].classList.add('correct');
          answeredCount++;
          correctCount++;
        } else if (userAnswers[i] === false) {
          buttons[i].classList.add('incorrect');
          answeredCount++;
        }
      }

      answeredCountEl.innerText = `已作答 ${answeredCount} ／ 50`;
      hankoScoreEl.innerText = correctCount;
    }

    // 載入題目
    function loadQuestion() {
      const q = quizData[currentQuestion];
      qTagEl.innerText = q.type;
      qNumEl.innerText = `第 ${currentQuestion + 1} 題 ／ 共 50 題`;
      qTextEl.innerText = q.q;
      progressBarEl.style.width = `${((currentQuestion + 1) / quizData.length) * 100}%`;

      optionsEl.innerHTML = '';
      const isAnswered = userAnswers[currentQuestion] !== null;

      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt;
        if (isAnswered) {
          btn.disabled = true;
          if (idx === q.answer) btn.classList.add('correct');
        }
        btn.onclick = () => selectOption(idx);
        optionsEl.appendChild(btn);
      });

      if (isAnswered) {
        showExplanation(q, userAnswers[currentQuestion]);
      } else {
        explanationEl.classList.remove('show');
      }

      updateJumpGridUI();
    }

    // 顯示解析
    function showExplanation(q, isCorrect) {
      verdictEl.className = `verdict ${isCorrect ? 'ok' : 'ng'}`;
      verdictEl.innerText = isCorrect ? "【正解】恭喜答對！" : "【不正解】再接再厲！";
      translationEl.innerText = q.translation;
      
      notesEl.innerHTML = `
        <li>${q.details.correct}</li>
        ${q.details.wrong.map(w => `<li>${w}</li>`).join('')}
      `;
      explanationEl.classList.add('show');
    }

    // 作答選擇
    function selectOption(idx) {
      if (userAnswers[currentQuestion] !== null) return;

      const q = quizData[currentQuestion];
      const buttons = optionsEl.getElementsByTagName('button');
      const isCorrect = (idx === q.answer);
      userAnswers[currentQuestion] = isCorrect;

      if (isCorrect) {
        buttons[idx].classList.add('correct');
      } else {
        buttons[idx].classList.add('incorrect');
        buttons[q.answer].classList.add('correct');
      }

      for (let btn of buttons) btn.disabled = true;

      showExplanation(q, isCorrect);
      updateJumpGridUI();
    }

    function nextQuestion() {
      if (currentQuestion < quizData.length - 1) {
        currentQuestion++;
        loadQuestion();
      } else {
        checkFinish();
      }
    }

    function prevQuestion() {
      if (currentQuestion > 0) {
        currentQuestion--;
        loadQuestion();
      }
    }

    function goToQuestion(idx) {
      currentQuestion = idx;
      loadQuestion();
    }

    function checkFinish() {
      const answered = userAnswers.filter(a => a !== null).length;
      if (answered < quizData.length) {
        if (!confirm(`還有 ${quizData.length - answered} 題尚未作答，確定要查看總成績嗎？`)) return;
      }
      showScore();
    }

    function showScore() {
      stageEl.style.display = 'none';
      resultsEl.style.display = 'block';
      document.querySelector('.sidebar').style.display = 'none';

      const correctCount = userAnswers.filter(a => a === true).length;
      document.getElementById('result-correct').innerText = correctCount;
      document.getElementById('result-desc').innerText = correctCount >= 45 ? "太出色了！第 4 週漢字語彙掌握得完美無缺！" : correctCount >= 35 ? "表現優異！再接再厲就能挑戰 N1 高分！" : "建議搭配右側生字速查卡多加溫習喔！";
    }

    function restartQuiz() {
      currentQuestion = 0;
      userAnswers = new Array(quizData.length).fill(null);
      resultsEl.style.display = 'none';
      stageEl.style.display = 'flex';
      document.querySelector('.sidebar').style.display = 'flex';
      initJumpGrid();
      loadQuestion();
    }

    // 初始化執行
    initJumpGrid();
    switchVocabDay(1);
    loadQuestion();
  </script>

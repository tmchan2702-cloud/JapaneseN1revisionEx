            background: #f1f5f9;
            padding: 12px;
            border-radius: 10px;
        }

            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 6px 0;

            font-weight: bold;
            transition: all 0.2s;

        }
        .nav-btn.answered {
            background: #c7d2fe;
            border-color: #818cf8;
            color: #312e81;
        }

    let currentQuestion = 0;
    let userAnswers = new Array(quizData.length).fill(null);

    // 切換模式（測驗 vs 生字速查面板）
    function switchMode(mode) {
        const btnQuiz = document.getElementById('btnQuizMode');
        const btnVocab = document.getElementById('btnVocabMode');
        const vocabPanel = document.getElementById('vocab-panel');
        const quizWrapper = document.getElementById('quiz-main-wrapper');

        if (mode === 'quiz') {
            btnQuiz.classList.add('active');
            btnVocab.classList.remove('active');
            vocabPanel.style.display = 'none';
            quizWrapper.style.display = 'block';
        } else {
            btnVocab.classList.add('active');
            btnQuiz.classList.remove('active');
            vocabPanel.style.display = 'block';
            quizWrapper.style.display = 'none';
            renderVocabPanel();
        }
    }

    // 渲染生字速查卡片面板
    function renderVocabPanel() {
        const container = document.getElementById('vocabContainer');
        if (container.innerHTML.trim() !== '') return; // 避免重複渲染

        let html = '';
        vocabData.forEach(dayGroup => {
            html += `
                <div class="day-section">
                    <div class="day-title">${dayGroup.day}</div>
                    <div class="vocab-grid">
            `;
            dayGroup.words.forEach(item => {
                html += `
                    <div class="vocab-card">
                        <div class="vocab-word">${item.word}</div>
                        <div class="vocab-meaning">${item.meaning}</div>
                    </div>
                `;
            });
            html += `
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    // 初始化測驗介面
    function initQuiz() {
        renderNavGrid();
        loadQuestion(currentQuestion);
    }

    // 渲染導航方格
    function renderNavGrid() {
        const navGrid = document.getElementById('navGrid');
        navGrid.innerHTML = '';
        quizData.forEach((_, index) => {
            const btn = document.createElement('button');
            btn.className = 'nav-btn';
            btn.innerText = index + 1;
            if (userAnswers[index] !== null) {
                btn.classList.add('answered');
            }
            if (index === currentQuestion) {
                btn.classList.add('current');
            }
            btn.onclick = () => goToQuestion(index);
            navGrid.appendChild(btn);
        });
    }

    // 載入指定題目
    function loadQuestion(index) {
        currentQuestion = index;
        const qData = quizData[index];
        const container = document.getElementById('question-container');
        
        let html = `
            <div class="question-card">
                <div class="question-header">
                    <span class="question-badge">${qData.type}</span>
                    <span style="font-size: 0.9rem; color: #64748b; font-weight: bold;">第 ${index + 1} 題 / 共 50 題</span>
                </div>
                <div class="question-title">${qData.q}</div>
                <ul class="options-list">
        `;

        qData.options.forEach((opt, optIndex) => {
            let itemClass = 'option-item';
            const isAnswered = userAnswers[index] !== null;
            const selectedOpt = userAnswers[index];

            if (isAnswered) {
                if (optIndex === qData.answer) {
                    itemClass += ' correct';
                } else if (selectedOpt === optIndex) {
                    itemClass += ' incorrect';
                }
            } else if (selectedOpt === optIndex) {
                itemClass += ' selected';
            }

            html += `<li class="${itemClass}" onclick="selectOption(${index}, ${optIndex})">${opt}</li>`;
        });

        html += `</ul>`;
        
        if (userAnswers[index] !== null) {
            html += `
                <div class="explanation-box" style="display: block;">
                    <div class="translation">【全句翻譯】${qData.translation}</div>
                    <p><strong>【正確解析】</strong>${qData.details.correct}</p>
                    <p><strong>【錯誤選項辨析】</strong></p>
                    <ul style="margin: 5px 0 0 20px; padding: 0;">
            `;
            qData.details.wrong.forEach(w => {
                html += `<li style="margin-bottom: 4px; color: #581c87;">${w}</li>`;
            });
            html += `
                    </ul>
                </div>
            `;
        }

        html += `</div>`;
        container.innerHTML = html;

        // 更新進度與按鈕狀態
        document.getElementById('progressIndicator').innerText = `${currentQuestion + 1} / ${quizData.length}`;
        document.getElementById('prevBtn').disabled = currentQuestion === 0;
        document.getElementById('nextBtn').innerText = currentQuestion === quizData.length - 1 ? '查看成績' : '下一題';
        
        renderNavGrid();
    }

    // 選擇答案
    function selectOption(qIndex, optIndex) {
        if (userAnswers[qIndex] !== null) return; // 作答後不可更改
        userAnswers[qIndex] = optIndex;
        loadQuestion(qIndex);
    }

    // 上一題
    function prevQuestion() {
        if (currentQuestion > 0) {
            loadQuestion(currentQuestion - 1);
        }
    }

    // 下一題 / 結算
    function nextQuestion() {
        if (currentQuestion < quizData.length - 1) {
            loadQuestion(currentQuestion + 1);
        } else {
            showResult();
        }
    }

    // 跳轉到指定題目
    function goToQuestion(index) {
        loadQuestion(index);
    }

    // 顯示結算畫面
    function showResult() {
        let score = 0;
        userAnswers.forEach((ans, index) => {
            if (ans === quizData[index].answer) {
                score++;
            }
        });

        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('navGrid').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';
        document.getElementById('score-display').innerText = `${score} / ${quizData.length}`;

        let comment = "";
        const percentage = (score / quizData.length) * 100;
        if (percentage === 100) {
            comment = "太神啦！全數答對，對第4週漢字與語彙的掌握已臻化境！";
        } else if (percentage >= 80) {
            comment = "表現非常優秀！觀念清晰，實力堅強。";
        } else if (percentage >= 60) {
            comment = "及格囉！建議利用詳細解析與生字速查卡片面板再回頭複習容易混淆的詞彙。";
        } else {
            comment = "革命尚未成功！建議先瀏覽【生字速查卡片面板】熟悉核心詞彙後再重新測驗。";
        }
        document.getElementById('result-comment').innerText = comment;
    }

    // 重新測驗
    function restartQuiz() {
        userAnswers = new Array(quizData.length).fill(null);
        currentQuestion = 0;
        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'block';
        document.getElementById('navGrid').style.display = 'grid';
        initQuiz();
    }

    // 頁面載入時初始化
    window.onload = initQuiz;
</script>
